[package]
name = "aws-profile-switcher"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Switch AWS_PROFILE in your current shell"
repository = "https://github.com/peterkracik/aws-profile-switcher"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
inquire = "0.9.5"
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
